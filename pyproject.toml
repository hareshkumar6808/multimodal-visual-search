[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-visual-search"
version = "0.1.0"
description = "Stage 1 multimodal perception and adaptive orchestration backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10.0,<12",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pytesseract>=0.3.10,<1",
  "python-multipart>=0.0.9,<1",
  "numpy>=1.26,<2.4",
  "scikit-learn>=1.5,<2",
  "sqlparse>=0.5,<1",
  "sympy>=1.13,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]
perception-ml = [
  "numpy>=1.26,<2.4",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]
perception-onnx = [
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
]
research = [
  "datasets>=4,<5",
]
training = [
  "datasets>=3,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["contracts", "services"]

[tool.hatch.build.targets.wheel.force-include]
"models/perception/mobilenet_v3_small.onnx" = "models/perception/mobilenet_v3_small.onnx"
"models/perception/mobilenet_v3_small.pth" = "models/perception/mobilenet_v3_small.pth"

[[tool.mypy.overrides]]
module = ["sympy", "sqlparse", "sqlparse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
packages = ["contracts", "services"]

[[tool.mypy.overrides]]
module = [
  "joblib", "joblib.*", "numpy", "numpy.*",
  "torch", "torch.*", "torchvision", "torchvision.*",
]
follow_imports = "skip"
ignore_missing_imports = true
